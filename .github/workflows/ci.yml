name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke-test packed tarball (ESM + CJS)
        run: |
          npm pack --pack-destination /tmp
          mkdir -p /tmp/pkgtest && cd /tmp/pkgtest
          npm init -y
          npm install /tmp/hrr-lib-*.tgz
          node --input-type=module -e "import { encodeAtom, similarity } from 'hrr-lib'; if (similarity(encodeAtom('x'), encodeAtom('x')) !== 1) process.exit(1)"
          node -e "const { encodeAtom, similarity } = require('hrr-lib'); if (similarity(encodeAtom('x'), encodeAtom('x')) !== 1) process.exit(1)"
      - name: Verify the bundle has no Node builtins
        run: |
          if grep -rn "node:" dist/; then
            echo "dist still references a Node builtin" >&2
            exit 1
          fi
